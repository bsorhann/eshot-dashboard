name: Referans veri

# Durak, hat ve guzergah verilerini Izmir Acik Veri Portali'ndan indirir.
# Elle calistirilir; ayrica her ayin 1'inde otomatik guncellenir.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 1 * *"

permissions:
  contents: write

jobs:
  indir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklar
        run: pip install requests

      - name: Indir
        run: python referans_indir.py

      - name: Kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ref
          git commit -q -m "Update reference data" || echo "Nothing to commit"
          for deneme in 1 2 3; do
            git pull -q --rebase && git push -q && break
            sleep 10
          done
