name: Veri toplama

# Saatte bir tetiklenir. Ayni anda yalnizca bir is calisir; calisan is bitince
# siradaki hemen baslar. Her is ~5 saat toplar ve her saat depoya kaydeder.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veri-toplama
  cancel-in-progress: false

jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklar
        run: pip install requests

      - name: Topla ve her saat kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Isin toplam suresi 350 dk ile sinirli. Toplama 5,5 saatte biter;
          # son tur kalan sureye gore kisaltilir, kaydetmeye her zaman zaman kalir.
          bitis=$((SECONDS + 330 * 60))
          while [ $((bitis - SECONDS)) -gt 300 ]; do
            kalan_dk=$(( (bitis - SECONDS) / 60 ))
            sure=$(( kalan_dk < 55 ? kalan_dk : 55 ))
            gun=$(date -u +%F)
            saat=$(date -u +%H%M%S)
            mkdir -p "data/raw/$gun"
            dosya="data/raw/$gun/$saat.csv"

            python collector.py --cikti "$dosya" --sure "$sure" || echo "Toplayici hata verdi, devam ediliyor"

            if [ -s "$dosya" ]; then
              gzip -f "$dosya"
              git add data
              git commit -q -m "Add bus position data $gun $saat UTC" || echo "Nothing to commit"
              for deneme in 1 2 3; do
                git pull -q --rebase && git push -q && break
                echo "Push basarisiz (deneme $deneme), 10 sn sonra tekrar"
                sleep 10
              done || true
            fi
          done
