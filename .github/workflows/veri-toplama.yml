name: Veri toplama

# Zincirleme calisir: her is, toplayici 10 dakika sorunsuz calistiktan sonra bir sonraki
# isi kendisi siraya koyar; o is bu bittigi anda baslar, boylece veri araliksiz toplanir.
# GitHub'in zamanlayicisi (saatte bir) yalnizca zincir koparsa yedek olarak devreye girer.
# Zinciri durdurmak icin: Actions > Veri toplama > ... > Disable workflow.
# Ayni anda yalnizca bir is calisir. Her iste toplayici ~5,5 saat calisir:
# Izmir API'sinin istek sinirina (dakikada ~60) uyarak otobusu olan hatlari 5 dakikada,
# bos donen hatlari 30 dakikada bir sorar. Saatlik dosyalar git gecmisine degil,
# gunluk bir Release'e yuklenir (depoyu sisirmemek icin): etiket "veri-YYYY-MM-DD".
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write     # bir sonraki isi siraya koymak icin

concurrency:
  group: veri-toplama
  cancel-in-progress: false

jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklar
        run: pip install requests

      - name: Topla ve hazir dosyalari Release'e yukle
        run: |
          yukle() {
            for f in cikti/hazir/*.csv.gz; do
              [ -e "$f" ] || continue
              ad=$(basename "$f" .csv.gz)        # 2026-10-30__124347
              gun=${ad%%__*}; saat=${ad##*__}
              etiket="veri-$gun"
              mkdir -p yukleme && cp "$f" "yukleme/$saat.csv.gz"
              gh release view "$etiket" > /dev/null 2>&1 || \
                gh release create "$etiket" --prerelease --title "Bus position data $gun" \
                  --notes "Raw ESHOT bus positions for $gun (UTC), all lines, rate-limited scheduler." || true
              for deneme in 1 2 3; do
                if gh release upload "$etiket" "yukleme/$saat.csv.gz" --clobber; then
                  rm -f "$f"; break
                fi
                echo "Yukleme basarisiz (deneme $deneme), 15 sn sonra tekrar"
                sleep 15
              done
              rm -f "yukleme/$saat.csv.gz"
            done
          }

          # Toplayici 330 dk calisir; is 350 dk ile sinirli, son yuklemeye zaman kalir.
          python collector.py --tum-hatlar --planlayici --donen-klasor cikti --sure 330 &
          PID=$!
          BASLANGIC=$(date +%s); SIRADAKI=0
          while kill -0 "$PID" 2> /dev/null; do
            sleep 60
            yukle
            # Toplayici 10 dk ayakta kaldiysa bir sonraki isi siraya koy (hemen cokerse
            # sonsuz hizli dongu olmasin diye bekleniyor).
            if [ "$SIRADAKI" = 0 ] && [ $(( $(date +%s) - BASLANGIC )) -ge 600 ]; then
              gh workflow run veri-toplama.yml --ref "$GITHUB_REF_NAME" \
                && echo "Sonraki is siraya kondu" || echo "Sonraki is siraya konamadi (yedek: zamanlayici)"
              SIRADAKI=1
            fi
          done
          wait "$PID" || echo "Toplayici hata ile bitti"
          yukle
